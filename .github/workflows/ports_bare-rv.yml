name: bare-rv port

on:
  push:
  pull_request:
    paths:
      - '.github/workflows/ports_bare-rv.yml'
      - 'py/**'
      - 'extmod/**'
      - 'shared/**'
      - 'lib/**'
      - 'ports/bare-rv/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XPACK_GCC_VERSION: 15.2.0-1
  XPACK_GCC_NAME: xpack-riscv-none-elf-gcc-15.2.0-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Cache xPack toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: ${{ env.XPACK_GCC_NAME }}
        key: ${{ env.XPACK_GCC_NAME }}-linux-x64
    - name: Download xPack RISC-V toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.XPACK_GCC_VERSION }}/${{ env.XPACK_GCC_NAME }}-linux-x64.tar.gz
        tar xf ${{ env.XPACK_GCC_NAME }}-linux-x64.tar.gz
    - name: Setup toolchain path
      run: echo "$PWD/${{ env.XPACK_GCC_NAME }}/bin" >> $GITHUB_PATH
    - name: Create output directory
      run: mkdir -p artifacts
    # XXXS ablation study: test 0 = all flags, tests 1-19 = minus one flag each
    # DO NOT REMOVE: -fmerge-all-constants breaks runtime on CH592
    # Flags: 1=flto-partition=one 2=fipa-pta 3=fipa-icf 4=fipa-sra 5=fipa-reference
    #        6=flive-range-shrinkage 7=fira-share-save-slots 8=fira-share-spill-slots
    #        9=ftree-tail-merge 10=fcode-hoisting 11=msave-restore 12=fconserve-stack
    #        13=fno-ident 14=fno-common 15=fno-unwind-tables 16=fno-asynchronous-unwind-tables
    #        17=fno-stack-protector 18=Wl,-O2 19=Wl,--sort-section=alignment
    - name: "Build 0 (all flags)"
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -fipa-icf -fipa-sra -fipa-reference -flive-range-shrinkage -fira-share-save-slots -fira-share-spill-slots -ftree-tail-merge -fcode-hoisting -msave-restore -fconserve-stack -fno-ident -fno-common -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -Wl,-O2 -Wl,--sort-section=alignment"
        cp ports/bare-rv/build/firmware.bin artifacts/0.bin
    - name: "Build 1 (-flto-partition=one)"
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -fipa-pta -fipa-icf -fipa-sra -fipa-reference -flive-range-shrinkage -fira-share-save-slots -fira-share-spill-slots -ftree-tail-merge -fcode-hoisting -msave-restore -fconserve-stack -fno-ident -fno-common -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -Wl,-O2 -Wl,--sort-section=alignment"
        cp ports/bare-rv/build/firmware.bin artifacts/1.bin
    - name: "Build 2 (-fipa-pta)"
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-icf -fipa-sra -fipa-reference -flive-range-shrinkage -fira-share-save-slots -fira-share-spill-slots -ftree-tail-merge -fcode-hoisting -msave-restore -fconserve-stack -fno-ident -fno-common -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -Wl,-O2 -Wl,--sort-section=alignment"
