name: bare-rv port

on:
  push:
  pull_request:
    paths:
      - '.github/workflows/ports_bare-rv.yml'
      - 'py/**'
      - 'extmod/**'
      - 'shared/**'
      - 'lib/**'
      - 'ports/bare-rv/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XPACK_GCC_VERSION: 15.2.0-1
  XPACK_GCC_NAME: xpack-riscv-none-elf-gcc-15.2.0-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Cache xPack toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: ${{ env.XPACK_GCC_NAME }}
        key: ${{ env.XPACK_GCC_NAME }}-linux-x64
    - name: Download xPack RISC-V toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.XPACK_GCC_VERSION }}/${{ env.XPACK_GCC_NAME }}-linux-x64.tar.gz
        tar xf ${{ env.XPACK_GCC_NAME }}-linux-x64.tar.gz
    - name: Setup toolchain path
      run: echo "$PWD/${{ env.XPACK_GCC_NAME }}/bin" >> $GITHUB_PATH
    - name: Create output directory
      run: mkdir -p artifacts
    # DO NOT REMOVE: -fmerge-all-constants breaks runtime on CH592
    # XXXS flags proven by ablation study (see rv-opts.md):
    # -msave-restore:-3900, -fipa-pta:-320, -flto-partition=one:-117, -fmodulo-sched:-72
    # firmware = with compiler, firmware-noc = no compiler
    - name: Build firmware
      run: |
        make -C ports/bare-rv
        cp ports/bare-rv/build/firmware.bin artifacts/firmware.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware.elf
    - name: Build firmware-lto
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-flto"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-lto.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-lto.elf
    - name: Build firmware-xxxs
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -msave-restore -fmodulo-sched"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-xxxs.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-xxxs.elf
    - name: Build firmware-noc
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv MICROPY_ENABLE_COMPILER=0
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-noc.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-noc.elf
    - name: Build firmware-noc-lto
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv MICROPY_ENABLE_COMPILER=0 CFLAGS_EXTRA="-flto"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-noc-lto.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-noc-lto.elf
    - name: Build firmware-noc-xxxs
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv MICROPY_ENABLE_COMPILER=0 CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -msave-restore -fmodulo-sched"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-noc-xxxs.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-noc-xxxs.elf
    - name: Upload all firmware
      uses: actions/upload-artifact@v4
      with:
        name: bare-rv-firmware
        path: artifacts/
