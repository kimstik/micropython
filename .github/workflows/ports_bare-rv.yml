name: bare-rv port

on:
  push:
  pull_request:
    paths:
      - '.github/workflows/ports_bare-rv.yml'
      - 'py/**'
      - 'extmod/**'
      - 'shared/**'
      - 'lib/**'
      - 'ports/bare-rv/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XPACK_GCC_VERSION: 15.2.0-1
  XPACK_GCC_NAME: xpack-riscv-none-elf-gcc-15.2.0-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Cache xPack toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: ${{ env.XPACK_GCC_NAME }}
        key: ${{ env.XPACK_GCC_NAME }}-linux-x64
    - name: Download xPack RISC-V toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.XPACK_GCC_VERSION }}/${{ env.XPACK_GCC_NAME }}-linux-x64.tar.gz
        tar xf ${{ env.XPACK_GCC_NAME }}-linux-x64.tar.gz
    - name: Setup toolchain path
      run: echo "$PWD/${{ env.XPACK_GCC_NAME }}/bin" >> $GITHUB_PATH
    - name: Create output directory
      run: mkdir -p artifacts
    - name: Build standard
      run: |
        make -C ports/bare-rv
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-standard.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-standard.elf
    # - name: Build tiny (no compiler)
    #   run: |
    #     make -C ports/bare-rv clean
    #     make -C ports/bare-rv MICROPY_ENABLE_COMPILER=0
    #     cp ports/bare-rv/build/firmware.bin artifacts/firmware-tiny.bin
    #     cp ports/bare-rv/build/firmware.elf artifacts/firmware-tiny.elf
    - name: Build LTO
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA=-flto
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-lto.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-lto.elf
    # - name: Build tiny LTO
    #   run: |
    #     make -C ports/bare-rv clean
    #     make -C ports/bare-rv MICROPY_ENABLE_COMPILER=0 CFLAGS_EXTRA=-flto
    #     cp ports/bare-rv/build/firmware.bin artifacts/firmware-tiny-lto.bin
    #     cp ports/bare-rv/build/firmware.elf artifacts/firmware-tiny-lto.elf
    - name: Build XXXS (base - stable)
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-xxxs.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-xxxs.elf
    - name: Build XXXS1 (base + IPA/IRA)
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -fipa-icf -fipa-sra -fipa-reference -flive-range-shrinkage -fira-share-save-slots -fira-share-spill-slots"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-xxxs1.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-xxxs1.elf
    - name: Build XXXS2 (base + code transforms)
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -ftree-tail-merge -fcode-hoisting -fmerge-all-constants -msave-restore -fconserve-stack -fno-ident"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-xxxs2.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-xxxs2.elf
    - name: Build XXXS3 (base + stripping/linker)
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fno-common -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -Wl,-O2 -Wl,--sort-section=alignment"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-xxxs3.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-xxxs3.elf
    # - name: Build tiny XXXS (extreme size, no compiler)
    #   run: |
    #     make -C ports/bare-rv clean
    #     make -C ports/bare-rv MICROPY_ENABLE_COMPILER=0 CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -fipa-icf -fipa-sra -fipa-reference -flive-range-shrinkage -fira-share-save-slots -fira-share-spill-slots -ftree-tail-merge -fcode-hoisting -fno-common -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -fmerge-all-constants -msave-restore -fno-ident -fconserve-stack -Wl,-O2 -Wl,--sort-section=alignment"
    #     cp ports/bare-rv/build/firmware.bin artifacts/firmware-tiny-xxxs.bin
    #     cp ports/bare-rv/build/firmware.elf artifacts/firmware-tiny-xxxs.elf
    - name: Upload all firmware
      uses: actions/upload-artifact@v4
      with:
        name: bare-rv-firmware
        path: artifacts/
