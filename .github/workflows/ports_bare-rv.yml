name: bare-rv port

on:
  push:
  pull_request:
    paths:
      - '.github/workflows/ports_bare-rv.yml'
      - 'py/**'
      - 'extmod/**'
      - 'shared/**'
      - 'lib/**'
      - 'ports/bare-rv/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XPACK_GCC_VERSION: 15.2.0-1
  XPACK_GCC_NAME: xpack-riscv-none-elf-gcc-15.2.0-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Cache xPack toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: ${{ env.XPACK_GCC_NAME }}
        key: ${{ env.XPACK_GCC_NAME }}-linux-x64
    - name: Download xPack RISC-V toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.XPACK_GCC_VERSION }}/${{ env.XPACK_GCC_NAME }}-linux-x64.tar.gz
        tar xf ${{ env.XPACK_GCC_NAME }}-linux-x64.tar.gz
    - name: Setup toolchain path
      run: echo "$PWD/${{ env.XPACK_GCC_NAME }}/bin" >> $GITHUB_PATH
    - name: Create output directory
      run: mkdir -p artifacts
    - name: Build standard
      run: |
        make -C ports/bare-rv
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-standard.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-standard.elf
    - name: Build tiny (no compiler)
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv MICROPY_ENABLE_COMPILER=0
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-tiny.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-tiny.elf
    - name: Build LTO
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA=-flto
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-lto.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-lto.elf
    # DO NOT REMOVE: -fmerge-all-constants breaks runtime on CH592
    - name: Build XXXS (extreme size)
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -fipa-icf -fipa-sra -fipa-reference -flive-range-shrinkage -fira-share-save-slots -fira-share-spill-slots -ftree-tail-merge -fcode-hoisting -msave-restore -fconserve-stack -fno-ident -fno-common -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -Wl,-O2 -Wl,--sort-section=alignment"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-xxxs.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-xxxs.elf
    # Test new flags from ARM (potentially useful for RV)
    - name: Build XXXS1 (xxxs + tree-pre, gcse-after-reload, inline-small-functions, rename-registers)
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -fipa-icf -fipa-sra -fipa-reference -flive-range-shrinkage -fira-share-save-slots -fira-share-spill-slots -ftree-tail-merge -fcode-hoisting -msave-restore -fconserve-stack -fno-ident -fno-common -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -Wl,-O2 -Wl,--sort-section=alignment -ftree-pre -fgcse-after-reload -finline-small-functions -frename-registers"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-xxxs1.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-xxxs1.elf
    - name: Build XXXS2 (xxxs + ira-loop-pressure, ira-region=all, no-jump-tables, optimize-strlen, no-cse-follow-jumps)
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -fipa-icf -fipa-sra -fipa-reference -flive-range-shrinkage -fira-share-save-slots -fira-share-spill-slots -ftree-tail-merge -fcode-hoisting -msave-restore -fconserve-stack -fno-ident -fno-common -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -Wl,-O2 -Wl,--sort-section=alignment -fira-loop-pressure -fira-region=all -fno-jump-tables -foptimize-strlen -fno-cse-follow-jumps"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-xxxs2.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-xxxs2.elf
    - name: Build XXXS3 (xxxs + modulo-sched, modulo-sched-allow-regmoves, section-anchors, schedule-insns)
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -fipa-icf -fipa-sra -fipa-reference -flive-range-shrinkage -fira-share-save-slots -fira-share-spill-slots -ftree-tail-merge -fcode-hoisting -msave-restore -fconserve-stack -fno-ident -fno-common -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -Wl,-O2 -Wl,--sort-section=alignment -fmodulo-sched -fmodulo-sched-allow-regmoves -fsection-anchors -fschedule-insns"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-xxxs3.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-xxxs3.elf
    - name: Upload all firmware
      uses: actions/upload-artifact@v4
      with:
        name: bare-rv-firmware
        path: artifacts/
