name: bare-rv port

on:
  push:
  pull_request:
    paths:
      - '.github/workflows/ports_bare-rv.yml'
      - 'py/**'
      - 'extmod/**'
      - 'shared/**'
      - 'lib/**'
      - 'ports/bare-rv/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XPACK_GCC_VERSION: 15.2.0-1
  XPACK_GCC_NAME: xpack-riscv-none-elf-gcc-15.2.0-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Cache xPack toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: ${{ env.XPACK_GCC_NAME }}
        key: ${{ env.XPACK_GCC_NAME }}-linux-x64
    - name: Download xPack RISC-V toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.XPACK_GCC_VERSION }}/${{ env.XPACK_GCC_NAME }}-linux-x64.tar.gz
        tar xf ${{ env.XPACK_GCC_NAME }}-linux-x64.tar.gz
    - name: Setup toolchain path
      run: echo "$PWD/${{ env.XPACK_GCC_NAME }}/bin" >> $GITHUB_PATH
    - name: Create output directory
      run: mkdir -p artifacts
    - name: Build standard
      run: |
        make -C ports/bare-rv
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-standard.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-standard.elf
    - name: Build tiny (no compiler)
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv MICROPY_ENABLE_COMPILER=0
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-tiny.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-tiny.elf
    - name: Build LTO
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA=-flto
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-lto.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-lto.elf
    # DO NOT REMOVE: -fmerge-all-constants breaks runtime on CH592
    # XXXS = proven flags + ARM flags for testing
    # Proven: -Oz -flto -flto-partition=one -fipa-pta -msave-restore
    # ARM test: 20=ftree-pre 21=fgcse-after-reload 22=finline-small-functions 23=frename-registers
    #           24=fira-loop-pressure 25=fira-region=all 26=fno-jump-tables 27=foptimize-strlen
    #           28=fno-cse-follow-jumps 29=fmodulo-sched 30=fmodulo-sched-allow-regmoves
    #           31=fsection-anchors 32=fschedule-insns
    - name: Build XXXS (extreme size)
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -msave-restore -ftree-pre -fgcse-after-reload -finline-small-functions -frename-registers -fira-loop-pressure -fira-region=all -fno-jump-tables -foptimize-strlen -fno-cse-follow-jumps -fmodulo-sched -fmodulo-sched-allow-regmoves -fsection-anchors -fschedule-insns"
        cp ports/bare-rv/build/firmware.bin artifacts/firmware-xxxs.bin
        cp ports/bare-rv/build/firmware.elf artifacts/firmware-xxxs.elf
    # Ablation study pass 2: test ARM flags
    - name: "Build 0 (all flags)"
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -msave-restore -ftree-pre -fgcse-after-reload -finline-small-functions -frename-registers -fira-loop-pressure -fira-region=all -fno-jump-tables -foptimize-strlen -fno-cse-follow-jumps -fmodulo-sched -fmodulo-sched-allow-regmoves -fsection-anchors -fschedule-insns"
        cp ports/bare-rv/build/firmware.bin artifacts/0.bin
    - name: "Build 1 (-ftree-pre)"
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -msave-restore -fgcse-after-reload -finline-small-functions -frename-registers -fira-loop-pressure -fira-region=all -fno-jump-tables -foptimize-strlen -fno-cse-follow-jumps -fmodulo-sched -fmodulo-sched-allow-regmoves -fsection-anchors -fschedule-insns"
        cp ports/bare-rv/build/firmware.bin artifacts/1.bin
    - name: "Build 2 (-fgcse-after-reload)"
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -msave-restore -ftree-pre -finline-small-functions -frename-registers -fira-loop-pressure -fira-region=all -fno-jump-tables -foptimize-strlen -fno-cse-follow-jumps -fmodulo-sched -fmodulo-sched-allow-regmoves -fsection-anchors -fschedule-insns"
        cp ports/bare-rv/build/firmware.bin artifacts/2.bin
    - name: "Build 3 (-finline-small-functions)"
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -msave-restore -ftree-pre -fgcse-after-reload -frename-registers -fira-loop-pressure -fira-region=all -fno-jump-tables -foptimize-strlen -fno-cse-follow-jumps -fmodulo-sched -fmodulo-sched-allow-regmoves -fsection-anchors -fschedule-insns"
        cp ports/bare-rv/build/firmware.bin artifacts/3.bin
    - name: "Build 4 (-frename-registers)"
      run: |
        make -C ports/bare-rv clean
        make -C ports/bare-rv CFLAGS_EXTRA="-Oz -flto -flto-partition=one -fipa-pta -msave-restore -ftree-pre -fgcse-after-reload -finline-small-functions -fira-loop-pressure -fira-region=all -fno-jump-tables -foptimize-strlen -fno-cse-follow-jumps -fmodulo-sched -fmodulo-sched-allow-regmoves -fsection-anchors -fschedule-insns"
        cp ports/bare-rv/build/firmware.bin artifacts/4.bin
    - name: "Build 5 (-fira-loop-pressure)"
